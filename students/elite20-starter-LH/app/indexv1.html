<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIHUA-AI 编程助手 - 代码辅导平台 超越超星不是我的目标</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .header p { font-size: 1.1rem; opacity: 0.9; }
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 30px;
            margin-bottom: 20px;
        }
        .card-title {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus { outline: none; border-color: #667eea; }
        select {
            padding: 10px 20px;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            margin-bottom: 15px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 15px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        #result {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            color: #333;
            min-height: 300px;
            line-height: 1.6;
        }
        #result.loading { color: #667eea; font-style: italic; }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .feature-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            color: white;
            text-align: center;
        }
        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
            font-size: 0.9rem;
        }
        .motto { font-style: italic; margin-top: 10px; }
        .error-highlight { color: #dc3545; font-weight: bold; }
        .warning-highlight { color: #ffc107; }
        .success-highlight { color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI 编程助手</h1>
            <p>专业的代码辅导平台，帮助你提升编程能力，李华设计实现 ，版权所有，仅授权给精英班的所有老师和学生</p>
            <div class="motto">"完成任务是能力答卷，超越任务是认知革命，超越超星不是我的目标"</div>
        </div>

        <div class="feature-grid">
            <div class="feature-card">
                <h3>📖 代码理解</h3>
                <p>逐行分析代码逻辑</p>
            </div>
            <div class="feature-card">
                <h3>🔍 逻辑分析</h3>
                <p>深入分析代码思路</p>
            </div>
            <div class="feature-card">
                <h3>🐛 调试技巧</h3>
                <p>发现潜在问题</p>
            </div>
            <div class="feature-card">
                <h3>💡 最佳实践</h3>
                <p>提供优化建议</p>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">📝 输入你的代码</h2>
            
            <select id="language">
                <option value="kotlin">Kotlin</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="javascript">JavaScript</option>
                <option value="cpp">C++</option>
                <option value="c">C</option>
            </select>
            
            <textarea id="codeInput" placeholder="请在此输入你想要辅导的代码...">// Kotlin 代码示例
for(item in ArrayList) {
for(item in ArrayList) {
    println(item)
}
}</textarea>
            
            <button onclick="getHelp()">🚀 获取辅导</button>
        </div>

        <div class="card">
            <h2 class="card-title">📊 辅导结果</h2>
            <div id="result">点击上方按钮开始获取代码辅导...</div>
        </div>

        <div class="footer">
            <p>AI 编程助手 | Elite20 入门项目</p>
            <p>Created by LIHUAOK</p>
        </div>
    </div>

    <script>
        function analyzeKotlin(code) {
            let issues = [];
            let score = 70;
            
            if (!code.trim()) {
                return { score: 0, issues: ["代码为空"], suggestions: [], fix: "" };
            }
            
            // 检查语法问题
            const lines = code.split('\n');
            
            // 问题1: ArrayList没有实例化
            if (code.includes("ArrayList)") && !code.includes("ArrayList<")) {
                issues.push({ type: "error", msg: "ArrayList 需要指定泛型类型并实例化，如 ArrayList<String>()" });
                score -= 15;
            }
            
            // 问题2: 检查括号匹配
            let openBrace = 0;
            let openParen = 0;
            let braceLine = [];
            let parenLine = [];
            
            lines.forEach((line, idx) => {
                const lineNum = idx + 1;
                openBrace += (line.match(/\{/g) || []).length;
                openBrace -= (line.match(/\}/g) || []).length;
                openParen += (line.match(/\(/g) || []).length;
                openParen -= (line.match(/\)/g) || []).length;
                
                if (line.includes("{") && !line.includes("}")) braceLine.push(lineNum);
                if (line.includes("(") && !line.includes(")")) parenLine.push(lineNum);
            });
            
            if (openBrace !== 0) {
                issues.push({ type: "error", msg: `大括号不匹配！有 ${Math.abs(openBrace)} 个括号未闭合` });
                score -= 10;
            }
            
            if (openParen !== 0) {
                issues.push({ type: "error", msg: `小括号不匹配！有 ${Math.abs(openParen)} 个括号未闭合` });
                score -= 10;
            }
            
            // 问题3: 检查循环语法
            const forMatches = code.match(/for\s*\(/g) || [];
            const forInMatches = code.match(/for\s*\(\s*[\w_]+\s+in\s+/g) || [];
            
            if (forMatches.length !== forInMatches.length) {
                issues.push({ type: "error", msg: "for 循环语法错误，缺少 'in' 关键字或括号" });
                score -= 10;
            }
            
            // 问题4: 变量未定义检查
            if (code.includes("ArrayList)") && !code.includes("val ") && !code.includes("var ")) {
                issues.push({ type: "warning", msg: "ArrayList 似乎未定义，需要先声明变量" });
                score -= 5;
            }
            
            // 问题5: 代码格式化检查
            let formatIssues = [];
            lines.forEach((line, idx) => {
                if (idx > 0 && line.trim().startsWith("for(") && !lines[idx-1].trim().endsWith("{")) {
                    formatIssues.push(idx + 1);
                }
            });
            
            if (formatIssues.length > 0) {
                issues.push({ type: "warning", msg: `代码缩进建议：第 ${formatIssues.join(', ')} 行应缩进` });
                score -= 5;
            }
            
            // 生成修复建议
            let fixCode = "// ✅ 修复后的代码\n";
            fixCode += "fun main() {\n";
            fixCode += "    // 创建 ArrayList 实例\n";
            fixCode += "    val arrayList = ArrayList<String>()\n";
            fixCode += "    arrayList.add(\"元素1\")\n";
            fixCode += "    arrayList.add(\"元素2\")\n";
            fixCode += "\n";
            fixCode += "    // 正确的 for 循环\n";
            fixCode += "    for (item in arrayList) {\n";
            fixCode += "        println(item)\n";
            fixCode += "    }\n";
            fixCode += "}";
            
            return {
                score: Math.max(0, score),
                issues: issues,
                suggestions: [
                    "使用 val/var 声明变量",
                    "ArrayList 需要指定泛型类型",
                    "确保括号正确匹配",
                    "使用适当的缩进提高可读性",
                    "添加 main 函数作为入口"
                ],
                fix: fixCode
            };
        }

        function analyzePython(code) {
            let issues = [];
            let score = 75;
            
            if (!code.trim()) return { score: 0, issues: ["代码为空"], suggestions: [], fix: "" };
            
            if (code.includes("/")) {
                if (code.includes("0")) {
                    issues.push({ type: "warning", msg: "注意除数不能为零的情况" });
                    score -= 10;
                }
            }
            
            if (!code.includes("def ") && !code.includes("class ")) {
                issues.push({ type: "warning", msg: "建议封装为函数或类" });
                score -= 5;
            }
            
            return {
                score: score,
                issues: issues,
                suggestions: ["添加错误处理", "使用类型注解", "添加文档字符串"],
                fix: code
            };
        }

        function analyzeJava(code) {
            let issues = [];
            let score = 65;
            
            if (!code.trim()) return { score: 0, issues: ["代码为空"], suggestions: [], fix: "" };
            
            const hasClass = code.includes("class ");
            const hasMain = code.includes("main");
            
            if (!hasClass) {
                issues.push({ type: "error", msg: "Java 需要包含类定义" });
                score -= 20;
            }
            
            if (!hasMain) {
                issues.push({ type: "warning", msg: "建议添加 main 方法作为入口" });
                score -= 10;
            }
            
            return {
                score: score,
                issues: issues,
                suggestions: ["添加类定义", "添加 main 方法", "注意代码格式"],
                fix: code
            };
        }

        function analyzeCode(code, language) {
            switch(language) {
                case 'kotlin': return analyzeKotlin(code);
                case 'python': return analyzePython(code);
                case 'java': return analyzeJava(code);
                default:
                    return {
                        score: 70,
                        issues: [],
                        suggestions: ["注意代码格式", "添加注释", "考虑错误处理"],
                        fix: code
                    };
            }
        }

        function getHelp() {
            const code = document.getElementById('codeInput').value;
            const language = document.getElementById('language').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = 'AI 正在分析你的代码...请稍候...';
            resultDiv.className = 'loading';
            
            setTimeout(() => {
                const analysis = analyzeCode(code, language);
                
                let output = "【代码辅导报告】\n\n";
                output += "📊 总体评分：" + analysis.score + "/100\n\n";
                
                if (analysis.issues.length > 0) {
                    output += "❌ 发现的问题：\n";
                    analysis.issues.forEach((issue, idx) => {
                        const prefix = issue.type === "error" ? "🚨" : "⚠️";
                        output += `${idx + 1}. ${prefix} ${issue.msg}\n`;
                    });
                    output += "\n";
                } else {
                    output += "✅ 代码检查通过！\n\n";
                }
                
                output += "💡 改进建议：\n";
                analysis.suggestions.forEach((suggestion, idx) => {
                    output += `${idx + 1}. ${suggestion}\n`;
                });
                
                output += "\n🔧 修复后的代码：\n";
                output += analysis.fix;
                
                resultDiv.innerHTML = output;
                resultDiv.className = '';
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('AI 编程助手已加载就绪！');
        });
    </script>
</body>
</html>
